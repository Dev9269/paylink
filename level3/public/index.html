<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>PayLink — merchant dashboard</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 720px; margin: 0 auto; padding: 24px; background: #0f172a; color: #e2e8f0; }
  h1 { font-size: 22px; } .card { background: #1e293b; border: 1px solid #334155; border-radius: 10px; padding: 16px; margin: 12px 0; }
  input, button { font-size: 15px; padding: 8px 10px; border-radius: 8px; border: 1px solid #475569; background: #0f172a; color: #e2e8f0; }
  button { cursor: pointer; background: #0ea5e9; border: none; font-weight: 600; }
  button:hover { background: #38bdf8; }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .muted { color: #94a3b8; font-size: 13px; }
  .ok { color: #4ade80; } .pending { color: #facc15; }
  .event { font-family: monospace; font-size: 12px; border-top: 1px dashed #334155; padding: 4px 0; }
  a { color: #38bdf8; }
</style>
</head>
<body>
<h1>PayLink <span class="muted">merchant dashboard</span></h1>
<div class="card">
  <div class="row">
    <input id="amount" type="number" step="0.1" min="0.1" value="5" placeholder="Amount (XLM)"/>
    <button id="createBtn">Create payment link</button>
  </div>
  <p class="muted">Creates a Soroban escrow on Stellar testnet. Share the link or QR with your customer.</p>
</div>
<div id="links"></div>
<div class="card"><b>Live payment feed</b> <span class="muted">(contract events)</span><div id="events"></div></div>
<script>
const $ = (s) => document.querySelector(s);

async function refreshLinks() {
  const links = await (await fetch("/api/links")).json();
  $("#links").innerHTML = links.map((l) => `
    <div class="card">
      <div class="row">
        <b>${l.id}</b> <span class="muted">${l.amount} XLM</span>
        <span class="${l.status === "claimed" ? "ok" : "pending"}">${l.status}</span>
        <button data-pay="${l.id}" ${l.status !== "pending" ? "disabled" : ""}>Pay (demo)</button>
        <button data-claim="${l.id}" ${l.status !== "funded" ? "disabled" : ""}>Claim</button>
      </div>
      <p class="muted"><a href="${l.url}" target="_blank">${l.url}</a></p>
      <img src="/api/qr?url=${encodeURIComponent(l.url)}" width="160" height="160" alt="QR"/>
      ${l.fundedTx ? `<p class="muted">funded: <a href="https://stellar.expert/explorer/testnet/tx/${l.fundedTx}">${l.fundedTx.slice(0, 16)}…</a></p>` : ""}
      ${l.claimedTx ? `<p class="muted">claimed: <a href="https://stellar.expert/explorer/testnet/tx/${l.claimedTx}">${l.claimedTx.slice(0, 16)}…</a></p>` : ""}
    </div>`).join("");
}

async function refreshEvents() {
  const events = await (await fetch("/api/events")).json();
  $("#events").innerHTML = events.slice(-10).reverse().map((e) =>
    `<div class="event">ledger ${e.ledger} · ${e.topic} <span class="muted">${new Date(e.at).toLocaleTimeString()}</span></div>`).join("");
}

$("#createBtn").onclick = async () => {
  $("#createBtn").disabled = true;
  try {
    const r = await fetch("/api/links", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ amount: $("#amount").value }) });
    if (!r.ok) throw new Error((await r.json()).error);
    refreshLinks();
  } catch (e) { alert(e.message); }
  $("#createBtn").disabled = false;
};

document.body.addEventListener("click", async (e) => {
  const pay = e.target.dataset.pay, claim = e.target.dataset.claim;
  if (pay) { e.target.disabled = true; await fetch(`/api/link/${pay}/pay`, { method: "POST" }); refreshLinks(); }
  if (claim) { e.target.disabled = true; await fetch(`/api/link/${claim}/claim`, { method: "POST" }); refreshLinks(); }
});

refreshLinks(); refreshEvents();
setInterval(refreshLinks, 3000);
setInterval(refreshEvents, 3000);
</script>
</body>
</html>
