<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>PayLink</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 480px; margin: 0 auto; padding: 24px; background: #0f172a; color: #e2e8f0; text-align: center; }
  .card { background: #1e293b; border: 1px solid #334155; border-radius: 12px; padding: 24px; margin-top: 24px; }
  .amount { font-size: 34px; font-weight: 700; color: #38bdf8; }
  .muted { color: #94a3b8; font-size: 13px; }
  button { font-size: 16px; padding: 10px 18px; border-radius: 8px; border: none; background: #0ea5e9; color: white; font-weight: 600; cursor: pointer; margin-top: 12px; }
  a { color: #38bdf8; word-break: break-all; }
</style>
</head>
<body>
<h1>PayLink</h1>
<p class="muted">Secure escrow payment on Stellar testnet</p>
<div class="card">
  <p class="muted">Invoice <b id="id"></b></p>
  <p class="muted">Payee <span id="payee" style="color:#e2e8f0;font-size:12px;word-break:break-all;"></span></p>
  <p class="amount"><span id="amount"></span> XLM</p>
  <p id="status" class="muted">pending</p>
  <button id="payBtn">Pay with Stellar</button>
  <button id="openBtn">Open in wallet</button>
</div>
<div class="card"><p class="muted">Scan to pay on your phone</p><img id="qr" width="220" height="220" alt="QR"/></div>
<script>
const id = location.pathname.split("/").pop();
document.title = "PayLink " + id;

(async () => {
  const l = await (await fetch(`/api/link/${id}`)).json();
  document.getElementById("id").textContent = id;
  document.getElementById("payee").textContent = l.payee;
  document.getElementById("amount").textContent = l.amount;
  const url = location.origin + "/pay/" + id;
  document.getElementById("qr").src = "/api/qr?url=" + encodeURIComponent(url);
  document.getElementById("openBtn").onclick = () => location.href = "web+stellar:pay?destination=" + l.payee + "&amount=" + l.amount + "&asset=native";
  const tick = async () => {
    const s = await (await fetch(`/api/link/${id}`)).json();
    document.getElementById("status").textContent = "status: " + (s.state ? (s.state.claimed ? "paid & claimed" : s.state.funded ? "funded" : "pending") : "loading…");
    document.getElementById("payBtn").disabled = s.state && s.state.claimed;
    if (s.state && s.state.funded) document.getElementById("payBtn").textContent = "Already funded";
  };
  tick(); setInterval(tick, 3000);
  document.getElementById("payBtn").onclick = async () => {
    document.getElementById("payBtn").disabled = true;
    const r = await fetch(`/api/link/${id}/pay`, { method: "POST" });
    const j = await r.json();
    if (!r.ok) alert(j.error); else document.getElementById("payBtn").textContent = "Paid ✓ " + j.hash.slice(0, 10) + "…";
  };
})();
</script>
</body>
</html>
